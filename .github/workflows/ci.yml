name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: work_seeker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/work_seeker
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/work_seeker_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3100
      AI_MOCK: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE work_seeker_test"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migrate and seed (checks migrations apply to an empty database)
        run: npx prisma migrate deploy && npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      # The browser comes from cdn.playwright.dev and is cached per lockfile. System libraries come from the
      # runner image; apt (archive.ubuntu.com) is only used if Chromium can't start without it. `--with-deps`
      # used to apt-install 9 optional font packages on every run, so an Ubuntu mirror outage failed CI.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Install system libraries (only if Chromium can't start)
        run: |
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium starts with the runner image's libraries; skipping apt."
          else
            echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
            npx playwright install-deps chromium
          fi

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
